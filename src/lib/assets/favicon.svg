<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
  <radialGradient id="core" cx="50%" cy="50%">
    <stop offset="0%" stop-color="#000000"/>
    <stop offset="100%" stop-color="#080000"/>
  </radialGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge>
      <feMergeNode in="b"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<rect width="512" height="512" fill="#050000"/>

<g transform="translate(256,256) rotate(-12)" fill="none" filter="url(#glow)">
  <ellipse rx="185" ry="235" stroke="#ff6a00" stroke-width="7"/>
  <ellipse rx="170" ry="218" stroke="#ff7f11" stroke-width="5"/>
  <ellipse rx="150" ry="195" stroke="#ff5a00" stroke-width="4"/>
  <ellipse rx="130" ry="172" stroke="#d93b00" stroke-width="3"/>
  <ellipse rx="112" ry="150" stroke="#ff8c1a" stroke-width="3"/>
  <ellipse rx="95" ry="128" stroke="#c62c00" stroke-width="2"/>
</g>

<g stroke-linecap="round" fill="none" filter="url(#glow)">
  <path d="M70 90 C180 40, 300 60, 420 120" stroke="#ff7a00" stroke-width="6"/>
  <path d="M60 420 C170 350, 340 360, 455 280" stroke="#ff7a00" stroke-width="6"/>
  <path d="M420 80 C455 170, 455 300, 420 430" stroke="#ff6a00" stroke-width="5"/>
  <path d="M95 120 C60 220, 60 320, 90 400" stroke="#ff6a00" stroke-width="5"/>
</g>

<ellipse cx="256" cy="256" rx="72" ry="102" fill="url(#core)"/>
</svg>